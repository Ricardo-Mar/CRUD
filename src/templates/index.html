<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários · CRUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="logo-mark"></div>
  <div>
    <h1>usuários<span>.crud</span></h1>
    <p>cadastro, edição e exclusão de usuários</p>
  </div>
</header>

<main>
  <!-- FORMULÁRIO -->
  <section class="panel">
    <h2 id="form-title">Novo usuário</h2>
    <p class="form-hint">Campos com <span class="req">*</span> são obrigatórios</p>
    <form id="user-form">
      <div class="field">
        <label for="nome">Nome <span class="req">*</span></label>
        <input type="text" id="nome" placeholder="Maria Silva" maxlength="255" required>
      </div>

      <div class="field">
        <label for="email">E-mail <span class="req">*</span></label>
        <input type="email" id="email" placeholder="maria@email.com" maxlength="255" required>
      </div>

      <div class="field">
        <label for="cpf">CPF <span class="req">*</span></label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
      </div>

      <div class="field">
        <label for="telefone">Telefone <span class="req">*</span></label>
        <input type="text" id="telefone" placeholder="+55 79 91111-1111" maxlength="30" required>
      </div>

      <div class="field">
        <label for="data_nascimento">Data de nascimento <span class="req">*</span></label>
        <input type="date" id="data_nascimento" required>
      </div>

      <input type="hidden" id="id-original">

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="submit-btn">Cadastrar</button>
        <button type="button" class="btn-secondary" id="cancel-btn" style="display:none;">Cancelar</button>
      </div>
    </form>
  </section>

  <!-- LISTAGEM -->
  <section class="panel">
    <h2>Usuários cadastrados</h2>
    <div class="search-bar">
      <input type="text" id="busca-input" placeholder="Buscar por nome ou ID...">
      <button type="button" id="busca-btn" class="btn-secondary">Buscar</button>
    </div>
    <div id="user-grid" class="user-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      Nenhum usuário encontrado.
    </div>
  </section>
</main>

<script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
